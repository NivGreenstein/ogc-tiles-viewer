name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and Build
        # A closed PR only has its preview removed.
        if: github.event.action != 'closed'
        env:
          VITE_BASE_PATH: /ogc-tiles-viewer/pr-preview/pr-${{ github.event.number }}/
        run: |
          npm ci
          npm run build

      # Publishes dist/ to gh-pages under pr-preview/pr-<number>/, comments the URL on the PR,
      # and removes the preview when the PR is closed.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
